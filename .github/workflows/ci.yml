# CI for EEG Workbench
#
# 设计说明（逐步收紧，不在第一版就压死历史债）:
#   1. lint    —— 只把「会导致运行时错误」的规则设为阻断: F821 未定义名、E9 语法错误、F63/F7/F82
#                全量 ruff 规则（E/W/I/UP/B/...）当前还有 ~1400 处历史问题，待后续集中偿还后再阻断。
#   2. test    —— 完整 pytest 套件（QT_QPA_PLATFORM=offscreen，无需显示器）。
#   3. type    —— mypy  informational（非阻断），先收集存量错误，`mypy --strict` 迁移完成后再启用。
#
# 本地等价命令见 AGENTS.md / README。
#
# 矩阵覆盖 Windows + Ubuntu 两个 runner：项目需同时在两端可运行，
# Linux 侧额外安装 Qt xcb 系统依赖与中文字体（见 test job 的 apt 步骤）。
#
# 为什么 Linux 还要跑 Python 3.12：
#   锁文件里的 pyEDFlib 0.1.42 只发到 cp313 的 wheel，且 cp313 的 Linux 轮子
#   只有 aarch64 —— 也就是说 Linux x86_64 上只有 3.10/3.11/3.12 能纯靠轮子
#   装完全部依赖，3.13/3.14 必须有编译器（gcc + python3-dev）。
#   3.12 才是绝大多数 Linux 用户的默认版本，也是 run.sh 优先挑选的版本，
#   所以它必须被 CI 覆盖，而不是只在 3.14 上测一遍就宣称 Linux 可用。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install linters
        run: python -m pip install --disable-pip-version-check ruff==0.16.10 mypy==2.4.0

      - name: ruff — undefined names / syntax errors / builtin shadowing
        run: python -m ruff check src tests --select F821,E9,F63,F7,F82

      - name: mypy (informational, non-blocking)
        continue-on-error: true
        run: python -m mypy src/eeg_workbench --ignore-missing-imports --no-error-summary

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
        # 3.12 只在 Linux 上跑（见下面那条注释）。Windows 侧的 3.14 已经覆盖
        # 主流用法，再加一个 3.12 只是重复消耗 runner 时间。
        exclude:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # PySide6 的 Qt xcb 平台插件与字体栈不在 pip wheel 里，需系统级安装；
      # 中文字体缺失会让图形/界面中文渲染成方框（测试虽不因此失败，但会让
      # 字体相关断言失去意义），故一并装上。
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libopengl0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 \
            fonts-noto-cjk fonts-wqy-microhei

      - name: Install exact locked environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify pyEDFlib ships a wheel for Python 3.12 (the no-compiler claim)
        # 只在 3.12 上跑，这条命令在 3.13/3.14 上本来就该失败：
        # 那两个版本没有 pyEDFlib 轮子，装它们必须带编译器，属于预期行为，
        # 不是回归。在 3.14 上跑只会把「有编译器也装得上」和「有轮子」这两件
        # 不同的事混在一起，掩盖真正要守的那条承诺。
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          # 文档里承诺「Linux 用 Python 3.12 不需要编译器」，那这条承诺就得有人
          # 守着。pyEDFlib 是整个锁文件里唯一没有纯 python 兜底的 C 扩展，
          # 一旦上游发布新版把 cp312 轮子撤掉，这条命令会立刻失败，
          # 而不是等到某个用户装不上才发现文档在骗人。
          python -m pip download --disable-pip-version-check \
            --no-deps --only-binary=:all: --dest /tmp/wheelcheck \
            "pyEDFlib==0.1.42"
          rm -rf /tmp/wheelcheck

      - name: Environment report
        run: |
          python -V
          python -m pip list --format=freeze

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=line -p no:cacheprovider

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}
          path: |
            pytest_full.log
            .pytest_cache/**
          if-no-files-found: ignore
