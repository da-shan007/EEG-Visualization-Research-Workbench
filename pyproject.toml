[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-workbench"
version = "0.1.0"
description = "EEG Visualization Research Workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mne==1.13.2",
    "nibabel==5.4.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "pyedflib==0.1.42",
    "pyyaml==6.0.2",
    "python-dotenv==1.1.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "mne-bids==0.18.0",
    "pyqtgraph==0.13.7",
    "pingouin==0.7.0",
    "statsmodels==0.15.0",
]
[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-qt==4.4.0",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
]
[project.scripts]
eeg-workbench = "eeg_workbench.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eeg_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
markers = [
    "integration: slower end-to-end integration tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "T20", "SIM", "RET"]
ignore = ["E501", "TRY003"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false