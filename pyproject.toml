[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-workbench"
version = "0.1.0"
description = "EEG Visualization Research Workbench"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Research Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # GUI
    "PySide6==6.11.2",
    # scientific core (numpy/scipy require >=3.12)
    "mne==1.13.2",
    "nibabel==5.4.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    # file formats
    "pyedflib==0.1.42",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "mne-bids==0.20.0",
    # stats
    "pingouin==0.7.0",
    "statsmodels==0.15.0",
    # report rendering + config
    "Jinja2==3.1.6",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    # optional plotting acceleration
    "pyqtgraph==0.14.0",
]
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "black==26.10.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]
mcp = [
    "mne-mcp==0.4.4",
]
[project.scripts]
eeg-workbench = "eeg_workbench.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eeg_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
markers = [
    "integration: slower end-to-end integration tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "T20", "SIM", "RET"]
ignore = ["E501", "TRY003"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false