# CI for EEG Workbench
#
# 设计说明（逐步收紧，不在第一版就压死历史债）:
#   1. lint    —— 只把「会导致运行时错误」的规则设为阻断: F821 未定义名、E9 语法错误、F63/F7/F82
#                全量 ruff 规则（E/W/I/UP/B/...）当前还有 ~1400 处历史问题，待后续集中偿还后再阻断。
#   2. test    —— 完整 pytest 套件（QT_QPA_PLATFORM=offscreen，无需显示器）。
#   3. type    —— mypy  informational（非阻断），先收集存量错误，`mypy --strict` 迁移完成后再启用。
#
# 本地等价命令见 AGENTS.md / README。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (bug-finding rules only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install linters
        run: python -m pip install --disable-pip-version-check ruff==0.16.10 mypy==2.4.0

      - name: ruff — undefined names / syntax errors / builtin shadowing
        run: python -m ruff check src tests --select F821,E9,F63,F7,F82

      - name: mypy (informational, non-blocking)
        continue-on-error: true
        run: python -m mypy src/eeg_workbench --ignore-missing-imports --no-error-summary

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install exact locked environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Environment report
        run: |
          python -V
          python -m pip list --format=freeze

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=line -p no:cacheprovider

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            pytest_full.log
            .pytest_cache/**
          if-no-files-found: ignore
